services:

  servidor-lua:
    build:
      context: ./server

    container_name: servidor-lua

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "lua", "-e", "local s=require('socket').tcp(); local ok=s:connect('127.0.0.1',8080); os.exit(ok and 0 or 1)"]
      interval: 2s
      timeout: 1s
      retries: 5

  cliente-lua:
    build:
      context: ./client

    container_name: cliente-lua

    depends_on:
      servidor-lua:
        condition: service_healthy

    environment:
      SERVER_HOST: servidor-lua
      SERVER_PORT: "8080"

    stdin_open: true
    tty: true

    privileged: true